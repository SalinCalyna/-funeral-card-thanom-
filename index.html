<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>การ์ดเชิญ งานฌาปนกิจ คุณแม่ถนอม คีรีรัตน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Trirong:ital,wght@0,400;0,500;0,600;1,400&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#1f2328; --ink2:#3b3f45; --cream:#f7f3ea; --cream2:#efe7d6; --gold:#9c7b3c; --gold2:#c9a851; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; min-height:100%; }
  body{
    font-family:'Sarabun',system-ui,'Noto Sans Thai',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(130% 90% at 50% 0%, #fbf8f1 0%, #efe8d9 55%, #e4dac4 100%);
    display:flex; flex-direction:column; align-items:center;
    padding:22px 14px 40px; min-height:100vh;
  }
  .wrap{ width:100%; max-width:440px; display:flex; flex-direction:column; align-items:center; }
  .topnote{ font-family:'Trirong',serif; letter-spacing:.14em; font-size:13px; color:var(--gold); text-transform:none; margin:4px 0 16px; opacity:.9;}
  .stage{ position:relative; width:100%; aspect-ratio:910/1282; perspective:1600px; }
  .cardimg, .cover{ position:absolute; inset:0; border-radius:10px; overflow:hidden; }
  .cardimg{ box-shadow:0 18px 50px rgba(40,30,10,.28); background:#fff;}
  .cardimg img{ width:100%; height:100%; display:block; object-fit:cover; }

  /* cover doors */
  .cover{ pointer-events:auto; }
  .door{ position:absolute; top:0; height:100%; width:50%;
    background:
      linear-gradient(180deg,#faf6ee,#efe6d4);
    border:1px solid rgba(156,123,60,.5);
    transition:transform 1.25s cubic-bezier(.62,.03,.2,1), box-shadow .8s;
    backface-visibility:hidden; will-change:transform;
    box-shadow:inset 0 0 40px rgba(156,123,60,.12);
  }
  .door.left{ left:0; transform-origin:left center; border-right:none; border-radius:10px 0 0 10px;}
  .door.right{ right:0; transform-origin:right center; border-left:none; border-radius:0 10px 10px 0;}
  .door::after{ content:""; position:absolute; inset:9px; border:1px solid rgba(156,123,60,.45); border-radius:6px; }
  .seam{ position:absolute; top:0; left:50%; width:1px; height:100%; transform:translateX(-.5px);
    background:linear-gradient(180deg,transparent,rgba(156,123,60,.55),transparent); z-index:4; transition:opacity .6s;}

  .face{ position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:26px 20px; transition:opacity .7s ease; pointer-events:none; }
  .corner{ position:absolute; width:46px; height:46px; border:1.5px solid rgba(156,123,60,.6); }
  .corner.tl{ top:14px; left:14px; border-right:none; border-bottom:none;}
  .corner.tr{ top:14px; right:14px; border-left:none; border-bottom:none;}
  .corner.bl{ bottom:14px; left:14px; border-right:none; border-top:none;}
  .corner.br{ bottom:14px; right:14px; border-left:none; border-top:none;}
  .portrait{ width:150px; height:172px; margin-bottom:12px; filter:drop-shadow(0 6px 14px rgba(40,30,10,.22)); }
  .portrait img{ width:100%; height:100%; object-fit:contain; display:block; }
  .lead{ font-family:'Trirong',serif; font-size:15px; letter-spacing:.2em; color:var(--gold); margin:2px 0 8px;}
  .name{ font-family:'Trirong',serif; font-size:23px; font-weight:600; color:var(--ink); line-height:1.35; margin:0 0 2px;}
  .sub{ font-size:14px; color:var(--ink2); margin:2px 0 1px;}
  .age{ font-size:13px; color:#6b6257; margin-bottom:16px;}
  .divider{ width:120px; height:14px; margin:4px 0 16px; opacity:.7;
    background:no-repeat center/contain url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='14' viewBox='0 0 120 14'><g fill='none' stroke='%239c7b3c' stroke-width='1'><line x1='2' y1='7' x2='44' y2='7'/><line x1='76' y1='7' x2='118' y2='7'/><circle cx='60' cy='7' r='4'/><circle cx='49' cy='7' r='1.6' fill='%239c7b3c'/><circle cx='71' cy='7' r='1.6' fill='%239c7b3c'/></g></svg>");}
  .tap{ display:inline-flex; align-items:center; gap:8px; font-size:14px; letter-spacing:.14em; color:var(--gold);
    border:1px solid rgba(156,123,60,.55); border-radius:999px; padding:9px 18px; background:rgba(255,255,255,.4);
    animation:pulse 2.1s ease-in-out infinite;}
  .tap svg{ width:15px; height:15px; animation:nudge 2.1s ease-in-out infinite;}
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(156,123,60,.28);} 50%{ box-shadow:0 0 0 10px rgba(156,123,60,0);} }
  @keyframes nudge{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(3px);} }

  /* open state */
  .stage.open .door.left{ transform:rotateY(-108deg); box-shadow:12px 0 34px rgba(0,0,0,.22);}
  .stage.open .door.right{ transform:rotateY(108deg); box-shadow:-12px 0 34px rgba(0,0,0,.22);}
  .stage.open .face{ opacity:0; }
  .stage.open .seam{ opacity:0; }
  .stage.done .cover{ pointer-events:none; }
  .stage.done .door, .stage.done .seam{ display:none; }

  .actions{ width:100%; max-width:440px; display:flex; gap:10px; margin-top:18px;
    opacity:0; transform:translateY(8px); transition:opacity .7s .5s, transform .7s .5s; pointer-events:none;}
  .stage.open ~ .actions{ opacity:1; transform:none; pointer-events:auto;}
  .btn{ flex:1; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none;
    font-family:'Sarabun',sans-serif; font-size:15px; font-weight:500; padding:13px 10px; border-radius:12px;
    border:1px solid rgba(156,123,60,.5); color:var(--ink); background:#fbf7ef; box-shadow:0 4px 14px rgba(40,30,10,.08);}
  .btn.primary{ background:linear-gradient(180deg,#5b6b4f,#44513b); color:#fdfbf4; border-color:#3c4634;}
  .btn:active{ transform:translateY(1px); }
  .btn svg{ width:17px; height:17px;}
  .hint{ font-size:12.5px; color:#8a8172; margin-top:14px; text-align:center; opacity:0; transition:opacity .6s .7s;}
  .stage.open ~ .hint{ opacity:1;}
  .footer{ margin-top:22px; font-size:11.5px; color:#a79f8d; letter-spacing:.05em; text-align:center;}

  /* lightbox */
  .lb{ position:fixed; inset:0; background:rgba(20,16,8,.92); display:none; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .lb.show{ display:flex; }
  .lb img{ max-width:100%; max-height:100%; border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,.5);}
  .lb .x{ position:absolute; top:16px; right:18px; color:#fff; font-size:30px; line-height:1; text-decoration:none;}
</style>
</head>

  <div class="lb" id="lb"><a class="x" href="#" id="lbx">&times;</a><img id="lbimg" src="" alt="การ์ดเต็ม"></div>

<script>
  var stage=document.getElementById('stage');
  var cover=document.getElementById('cover');
  var opened=false;
  function openCard(){
    if(opened) return; opened=true;
    stage.classList.add('open');
    setTimeout(function(){ stage.classList.add('done'); }, 1300);
  }
  cover.addEventListener('click', openCard);
  // tap card (after open) -> lightbox
  var lb=document.getElementById('lb'), lbimg=document.getElementById('lbimg');
  var cardImg=document.getElementById('cardImg');
  document.querySelector('.cardimg').addEventListener('click',function(){
    if(!opened) return;
    lbimg.src=cardImg.src; lb.classList.add('show');
  });
  document.getElementById('lbx').addEventListener('click',function(e){e.preventDefault(); lb.classList.remove('show');});
  lb.addEventListener('click',function(e){ if(e.target===lb){ lb.classList.remove('show'); }});
</script>
</body>
</html>
